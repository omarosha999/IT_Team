<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars Site</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #333;
            overflow: hidden;
            display: flex;
            justify-content: flex-start;}
            
        /* omar */

        nav a {
            display: block;
            color: white;
            text-align: center;
            padding: 14px 16px;
            text-decoration: none;
        }

        nav a:hover {
            background-color: #ddd;
            color: black;
        }

        .container {
            padding: 20px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<!-- omartarek -->
<body>
    <nav>
        <a href="#" onclick="showPage('home')">Home</a>
        <a href="#" onclick="showPage('products')">Cars</a>
        <a href="#" onclick="showPage('login')">Log In</a>
        <a href="#" onclick="showPage('register')">Sign Up</a>
        <a href="#" onclick="showPage('contact')">Contact Us</a>
        <a href="#" onclick="showPage('Feedback')">Feedback</a>
    </nav>
    <div class="container">
        <div id="home">
            <h2>Welcome to the Cars Site</h2>
            <p>The best place to buy and sell cars in Egypt</p>
        </div>
        <div id="products" class="hidden">
            <h2>Car Models</h2>
            <ol>
                <li>Toyota</li>
                <li>Hyundai</li>
                <li>Kia</li>
                <li>BMW</li>
                <li>Mercedes</li>
                <li>porsche</li>

            </ol>
        </div>

        <div id="login" class="hidden">
            <h2>Log In</h2>
            <form>
                <label>Email:</label><br>
                <input type="email" name="email"><br>
                <label>Password:</label><br>
                <input type="password" name="password"><br><br>
                <input type="submit" value="Log In">
            </form>
        </div>


        <div id="register" class="hidden">
            <h2>Sign Up</h2>
            <form>
                <label>Name:</label><br>
                <input type="text" name="name"><br>
                <label>Email:</label><br>
                <input type="email" name="email"><br>
                <label>Password:</label><br>
                <input type="password" name="password"><br><br>
                <input type="submit" value="Sign Up">
            </form>
        </div>

        <div id="contact" class="hidden">
            <h2>Contact Us</h2>
            <p>Phone Number: 0123456789</p>
            <p>Email: info@cars.com</p>
        </div>


        <div id="Feedback" class="hidden">
            <h2>Feedback</h2>
            <form>
                <label for="fed">Feedback</label><br>
                <input type="text" name="Feedback" id="fed"><br><br>
                <input type="submit" value="Submit">
            </form>
        </div>
    </div>

    <script>
        function showPage(pageId) {
            const sections = ['home', 'products', 'contact', 'register', 'login', 'Feedback'];
            sections.forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(pageId).classList.remove('hidden');
        }
    </script>
</body>

</html>
